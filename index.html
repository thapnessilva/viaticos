<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Viáticos">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Viáticos</title>
<style>
:root{--bg:#f3f5f7;--card:#fff;--tx:#14202b;--mut:#64748b;--line:#e2e8f0;--pri:#0f766e;--pri2:#ccfbf1;--red:#dc2626;--redbg:#fee2e2;--amb:#b45309;--ambbg:#fef3c7;
--comp:#7c3aed;--compbg:#ede9fe;--p1:#2563eb;--p1bg:#dbeafe;--p2:#ea580c;--p2bg:#ffedd5;--grn:#15803d;--grnbg:#dcfce7}
@media(prefers-color-scheme:dark){:root{--bg:#0e1419;--card:#18212a;--tx:#e8eef3;--mut:#93a4b3;--line:#2a3743;--pri:#2dd4bf;--pri2:#134e4a;--redbg:#4c1d1d;--ambbg:#4a3412;--compbg:#33265c;--p1bg:#1e3a6e;--p2bg:#5a2b10;--grnbg:#14391f;--comp:#c4b5fd;--p1:#93c5fd;--p2:#fdba74;--red:#fca5a5;--amb:#fcd34d;--grn:#86efac}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}
header{background:var(--pri);color:#fff;padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top));font-weight:700;font-size:18px;position:sticky;top:0;z-index:5}
@media(prefers-color-scheme:dark){header{color:#042f2e}}
main{max-width:640px;margin:0 auto;padding:12px 16px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:0 0 10px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:4px 0}
.row span:first-child{color:var(--mut)}
.big{font-size:30px;font-weight:800}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.btn{border:0;border-radius:12px;padding:14px 8px;font-size:16px;font-weight:700;background:var(--pri);color:#fff;cursor:pointer;min-height:54px}
@media(prefers-color-scheme:dark){.btn{color:#042f2e}}
.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.btn.red{background:var(--red);color:#fff}
.btn.full{width:100%;margin-top:8px}
.btn.a{background:#16a34a;color:#fff}.btn.c{background:#2563eb;color:#fff}.btn.g{background:#ea580c;color:#fff}
.alert{background:var(--redbg);color:var(--red);padding:12px 14px;border-radius:12px;margin-bottom:12px;font-weight:700}
.warn{background:var(--ambbg);color:var(--amb);padding:8px 12px;border-radius:10px;margin:6px 0;font-size:14px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px}
.t-comp{background:var(--compbg);color:var(--comp)}.t-p1{background:var(--p1bg);color:var(--p1)}.t-p2{background:var(--p2bg);color:var(--p2)}
.t-ap{background:var(--grnbg);color:var(--grn)}.t-cb{background:var(--p1bg);color:var(--p1)}
.bar{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin:4px 0 8px}.bar i{display:block;height:100%;background:var(--pri)}
.mov{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.mov:last-child{border:0}.mov small{color:var(--mut);display:block}.mov .amt{font-weight:800;text-align:right;white-space:nowrap}
.mov .acts{display:flex;gap:6px;margin-top:6px}.mov .acts button{border:1px solid var(--line);background:none;color:var(--tx);border-radius:8px;padding:6px 12px;font-size:14px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;padding:14px 4px;font-size:15px;font-weight:700;color:var(--mut)}
nav button.on{color:var(--pri);box-shadow:inset 0 3px 0 var(--pri)}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px;font-weight:600}
input,select,textarea{width:100%;font:inherit;font-size:17px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx)}
.seg{display:grid;gap:8px;grid-template-columns:repeat(3,1fr)}
.seg label{margin:0;position:relative}.seg input{position:absolute;opacity:0}
.seg span{display:block;text-align:center;padding:12px 4px;border-radius:10px;border:2px solid var(--line);font-weight:700;font-size:14px;color:var(--tx)}
.seg input:checked+span.s-comp{background:var(--compbg);border-color:var(--comp);color:var(--comp)}
.seg input:checked+span.s-p1{background:var(--p1bg);border-color:var(--p1);color:var(--p1)}
.seg input:checked+span.s-p2{background:var(--p2bg);border-color:var(--p2);color:var(--p2)}
.seg input:checked+span.s-n{background:var(--pri2);border-color:var(--pri);color:var(--pri)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 4px;font-size:20px}
.hint{font-size:14px;color:var(--mut);margin-top:6px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.filters select{font-size:15px;padding:10px}
.sw{display:flex;align-items:center;justify-content:space-between;padding:10px 0}.sw input{width:26px;height:26px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:99px;z-index:30;font-size:14px}
.pos{color:var(--grn)}.neg{color:var(--red)}
</style>
</head>
<body>
<header id="hd">Viáticos</header>
<main id="app"></main>
<nav>
  <button data-v="panel">Panel</button>
  <button data-v="movs">Movimientos</button>
  <button data-v="ajustes">Ajustes</button>
</nav>
<div id="modal"></div>

<script>
'use strict';
const KEY = 'viaticos_v1';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const EPS = 1e-9;

function defaults() { return { settings: { p1: 'Persona 1', p2: 'Persona 2', COP: true, VES: true, umbral: 50 }, records: [] }; }
function load() {
  try { const j = JSON.parse(localStorage.getItem(KEY)); if (j && Array.isArray(j.records)) { j.settings = Object.assign(defaults().settings, j.settings); return j; } } catch (e) {}
  return defaults();
}
let S = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('No se pudo guardar en el dispositivo'); } }

/* ---------- formato ---------- */
const fmt = n => (Number(n) || 0).toLocaleString('es-CO', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtRate = n => (Number(n) || 0).toLocaleString('es-CO', { minimumFractionDigits: 2, maximumFractionDigits: 4 });
const num = v => { const n = parseFloat(String(v).trim().replace(/\s/g, '').replace(',', '.')); return isNaN(n) ? NaN : n; };
const fmtDate = ts => new Date(ts).toLocaleString('es-CO', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
const toLocalInput = ts => { const d = new Date(ts); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const round = (n, d = 2) => Math.round((n + Number.EPSILON) * 10 ** d) / 10 ** d;

/* ---------- lógica ---------- */
const MONEDAS = ['COP', 'VES'];
const CATS = ['Comida', 'Taxi', 'Otro'];
function calc(st = S, excludeId = null) {
  const R = st.records.filter(r => r.id !== excludeId);
  const c = { aportado: 0, cambiado: 0, gastoUSDT: 0, mon: {}, cat: {}, tipo: { comp: 0, p1: 0, p2: 0 }, p: { p1: { pers: 0, comp: 0 }, p2: { pers: 0, comp: 0 } }, eq: {}, total: 0 };
  MONEDAS.forEach(m => c.mon[m] = { rec: 0, costo: 0, gas: 0, tasa: 0, saldo: 0, eq: 0, aj: 0 });
  CATS.forEach(k => c.cat[k] = 0);
  R.forEach(r => {
    if (r.type === 'aporte') c.aportado += r.usdt;
    else if (r.type === 'ajuste') c.mon[r.moneda].aj += r.monto;
    else if (r.type === 'cambio') { const m = c.mon[r.moneda]; m.rec += r.local; m.costo += r.usdt + (r.com || 0); c.cambiado += r.usdt + (r.com || 0); }
  });
  MONEDAS.forEach(m => { const o = c.mon[m]; o.tasa = o.costo > 0 ? o.rec / o.costo : 0; });
  R.forEach(r => {
    if (r.type !== 'gasto') return;
    let e;
    if (r.moneda === 'USDT') { e = r.monto; c.gastoUSDT += r.monto; }
    else { const o = c.mon[r.moneda]; o.gas += r.monto; e = o.tasa > 0 ? r.monto / o.tasa : 0; o.eq += e; }
    c.eq[r.id] = e; c.total += e;
    c.cat[r.cat] = (c.cat[r.cat] || 0) + e;
    c.tipo[r.tipo] += e;
    if (r.tipo === 'comp') { c.p.p1.comp += e / 2; c.p.p2.comp += e / 2; } else c.p[r.tipo].pers += e;
  });
  MONEDAS.forEach(m => { const o = c.mon[m]; o.saldo = o.rec - o.gas + o.aj; });
  c.restante = c.aportado - c.cambiado - c.gastoUSDT; // USDT sin cambiar ni gastar
  c.restanteSinCambiar = c.aportado - c.cambiado;
  return c;
}
const monedasActivas = () => MONEDAS.filter(m => S.settings[m]);
const nombre = t => t === 'p1' ? S.settings.p1 : t === 'p2' ? S.settings.p2 : 'Compartido';

/* ---------- UI helpers ---------- */
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2200); }
function closeModal() { $('#modal').innerHTML = ''; }
function modal(html) { $('#modal').innerHTML = `<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet">${html}</div></div>`; }
function tagTipo(t) { return `<span class="tag t-${t}">${t === 'comp' ? 'Compartido' : 'Personal ' + esc(nombre(t))}</span>`; }

let view = 'panel';
let F = { type: '', tipo: '', persona: '', cat: '', moneda: '' };
function go(v) { view = v; render(); window.scrollTo(0, 0); }
document.querySelectorAll('nav button').forEach(b => b.onclick = () => go(b.dataset.v));

function render() {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  $('#app').innerHTML = view === 'panel' ? vPanel() : view === 'movs' ? vMovs() : vAjustes();
  if (view === 'ajustes') bindAjustes();
}

/* ---------- panel ---------- */
function bars(obj, labelFn) {
  const tot = Object.values(obj).reduce((a, b) => a + b, 0);
  return Object.entries(obj).map(([k, v]) => `<div class="row"><span>${labelFn(k)}</span><b>${fmt(v)} USDT${tot > 0 ? ` · ${fmt(v / tot * 100)}%` : ''}</b></div><div class="bar"><i style="width:${tot > 0 ? v / tot * 100 : 0}%"></i></div>`).join('');
}
function vPanel() {
  const c = calc(), u = S.settings.umbral;
  let h = '';
  if (c.restante < u) h += `<div class="alert">⚠️ Fondo bajo: quedan ${fmt(c.restante)} USDT (umbral ${fmt(u)}).</div>`;
  h += `<div class="grid3"><button class="btn a" onclick="formAporte()">+ Aporte</button><button class="btn c" onclick="formCambio()">⇄ Cambio</button><button class="btn g" onclick="formGasto()">− Gasto</button></div><button class="btn sec full" style="margin:-4px 0 12px" onclick="formAjuste()">± Ajuste de saldo (no es gasto)</button>`;
  h += `<div class="card"><h2>Fondo en USDT</h2>
    <div class="row"><span>Total aportado</span><b>${fmt(c.aportado)}</b></div>
    <div class="row"><span>Total cambiado</span><b>${fmt(c.cambiado)}</b></div>
    ${c.gastoUSDT ? `<div class="row"><span>Gastado directo en USDT</span><b>${fmt(c.gastoUSDT)}</b></div>` : ''}
    <div class="row"><span>USDT restante sin cambiar</span><span class="big ${c.restante < u ? 'neg' : ''}">${fmt(c.restante)}</span></div></div>`;
  MONEDAS.filter(m => S.settings[m] || c.mon[m].rec || c.mon[m].gas).forEach(m => {
    const o = c.mon[m];
    h += `<div class="card"><h2>${m}</h2>
      <div class="row"><span>Total recibido</span><b>${fmt(o.rec)} ${m}</b></div>
      <div class="row"><span>Tasa prom. ponderada</span><b>${fmtRate(o.tasa)} ${m}/USDT</b></div>
      <div class="row"><span>Total gastado</span><b>${fmt(o.gas)} ${m}</b></div>
      ${o.aj ? `<div class="row"><span>Ajustes de saldo</span><b>${o.aj > 0 ? '+' : ''}${fmt(o.aj)} ${m}</b></div>` : ''}
      <div class="row"><span>Equiv. gastado</span><b>${fmt(o.eq)} USDT</b></div>
      <div class="row"><span>Saldo disponible en mano</span><span class="big ${o.saldo < 0 ? 'neg' : ''}" style="font-size:24px">${fmt(o.saldo)} ${m}</span></div></div>`;
  });
  h += `<div class="card"><h2>Total gastado global</h2><div class="row"><span>Equivalente en USDT</span><span class="big">${fmt(c.total)}</span></div>
    ${sinTasa(c) ? `<div class="warn">Hay gastos en una moneda sin cambios registrados: no se pueden convertir a USDT.</div>` : ''}</div>`;
  h += `<div class="card"><h2>Cuenta por persona</h2>`;
  ['p1', 'p2'].forEach(p => {
    const t = c.p[p].pers + c.p[p].comp;
    h += `<div class="row"><b style="font-size:18px">${esc(nombre(p))}</b><span class="big" style="font-size:22px">${fmt(t)} USDT</span></div>
      <div class="bar"><i style="width:${c.total > 0 ? t / c.total * 100 : 0}%"></i></div>
      <div class="row"><span>% del gasto total</span><b>${c.total > 0 ? fmt(t / c.total * 100) : '0,00'}%</b></div>
      <div class="row"><span>Personal</span><b>${fmt(c.p[p].pers)} USDT</b></div>
      <div class="row"><span>50% de compartidos</span><b>${fmt(c.p[p].comp)} USDT</b></div><hr style="border:0;border-top:1px solid var(--line)">`;
  });
  h += `</div><div class="card"><h2>Por categoría</h2>${bars(c.cat, k => esc(k))}</div>
    <div class="card"><h2>Por tipo de gasto</h2>${bars(c.tipo, k => tagTipo(k))}</div>
    <button class="btn sec full" onclick="cerrarViaje()">🏁 Cerrar viaje</button>`;
  return h;
}
function sinTasa(c) { return S.records.some(r => r.type === 'gasto' && r.moneda !== 'USDT' && c.mon[r.moneda].tasa === 0 && r.monto > 0); }

/* ---------- movimientos ---------- */
function filtrados() {
  return S.records.filter(r => {
    if (F.type && r.type !== F.type) return false;
    if (F.persona) { if (r.type !== 'gasto' || !(r.tipo === 'comp' || r.tipo === F.persona)) return false; }
    if (F.tipo && (r.type !== 'gasto' || r.tipo !== F.tipo)) return false;
    if (F.cat && (r.type !== 'gasto' || r.cat !== F.cat)) return false;
    if (F.moneda) { const m = r.type === 'aporte' ? 'USDT' : r.moneda; if (m !== F.moneda) return false; }
    return true;
  }).sort((a, b) => b.ts.localeCompare(a.ts));
}
function sel(id, opts, val) { return `<select onchange="F.${id}=this.value;render()">${opts.map(([v, t]) => `<option value="${v}" ${v === val ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>`; }
function vMovs() {
  const c = calc(), list = filtrados();
  let h = `<div class="card"><div class="filters">
    ${sel('type', [['', 'Todos los registros'], ['aporte', 'Aportes'], ['cambio', 'Cambios'], ['gasto', 'Gastos'], ['ajuste', 'Ajustes']], F.type)}
    ${sel('tipo', [['', 'Todo tipo de gasto'], ['comp', 'Compartido'], ['p1', 'Personal ' + S.settings.p1], ['p2', 'Personal ' + S.settings.p2]], F.tipo)}
    ${sel('persona', [['', 'Todas las personas'], ['p1', S.settings.p1], ['p2', S.settings.p2]], F.persona)}
    ${sel('cat', [['', 'Toda categoría'], ...CATS.map(k => [k, k])], F.cat)}
    ${sel('moneda', [['', 'Toda moneda'], ['USDT', 'USDT'], ['COP', 'COP'], ['VES', 'VES']], F.moneda)}
    <button class="btn sec" style="min-height:0;padding:8px" onclick="F={type:'',tipo:'',persona:'',cat:'',moneda:''};render()">Limpiar</button>
  </div><div class="hint">Persona = gastos propios + compartidos de esa persona.</div></div>`;
  h += `<div class="grid3"><button class="btn a" onclick="formAporte()">+ Aporte</button><button class="btn c" onclick="formCambio()">⇄ Cambio</button><button class="btn g" onclick="formGasto()">− Gasto</button></div><button class="btn sec full" style="margin:-4px 0 12px" onclick="formAjuste()">± Ajuste de saldo (no es gasto)</button>`;
  h += `<div class="card">${list.length ? list.map(r => movHtml(r, c)).join('') : '<div class="hint">Sin movimientos.</div>'}</div>`;
  return h;
}
function movHtml(r, c) {
  let t, amt, sub = '';
  if (r.type === 'aporte') { t = '<span class="tag t-ap">Aporte</span>'; amt = `<span class="pos">+${fmt(r.usdt)} USDT</span>`; }
  else if (r.type === 'ajuste') { t = '<span class="tag" style="background:var(--ambbg);color:var(--amb)">Ajuste de saldo</span>'; amt = `<span class="${r.monto > 0 ? 'pos' : 'neg'}">${r.monto > 0 ? '+' : '−'}${fmt(Math.abs(r.monto))} ${r.moneda}</span>`; }
  else if (r.type === 'cambio') {
    t = '<span class="tag t-cb">Cambio</span>'; amt = `${fmt(r.local)} ${r.moneda}`;
    sub = `${fmt(r.usdt)} USDT${r.com ? ` + ${fmt(r.com)} com.` : ''} · tasa ${fmtRate(r.local / (r.usdt + (r.com || 0)))}`;
  } else {
    t = `${tagTipo(r.tipo)} <span class="tag" style="background:var(--line)">${esc(r.cat)}</span>`; amt = `<span class="neg">−${fmt(r.monto)} ${r.moneda}</span>`;
    if (r.moneda !== 'USDT') sub = `≈ ${fmt(c.eq[r.id])} USDT`;
  }
  return `<div class="mov"><div><div>${t}</div><small>${fmtDate(r.ts)}${r.nota ? ' · ' + esc(r.nota) : ''}</small>${sub ? `<small>${sub}</small>` : ''}
    <div class="acts"><button onclick="editar('${r.id}')">Editar</button><button onclick="borrar('${r.id}')">Eliminar</button></div></div><div class="amt">${amt}</div></div>`;
}
function editar(id) { const r = S.records.find(x => x.id === id); if (r.type === 'aporte') formAporte(r); else if (r.type === 'ajuste') formAjuste(r); else if (r.type === 'cambio') formCambio(r); else formGasto(r); }
function borrar(id) { if (!confirm('¿Eliminar este registro? No se puede deshacer.')) return; S.records = S.records.filter(r => r.id !== id); save(); render(); toast('Registro eliminado'); }

/* ---------- formularios ---------- */
const fDate = r => `<label>Fecha y hora</label><input type="datetime-local" id="f_ts" value="${toLocalInput(r ? r.ts : new Date())}">`;
const fNota = (r, ph) => `<label>Nota (opcional)</label><input id="f_nota" placeholder="${ph}" value="${esc(r ? r.nota : '')}">`;
const fMon = (id, val, withUsdt) => {
  const opts = monedasActivas().slice(); if (val && !opts.includes(val) && val !== 'USDT') opts.push(val); if (withUsdt) opts.push('USDT');
  return `<select id="${id}">${opts.map(m => `<option ${m === val ? 'selected' : ''}>${m}</option>`).join('')}</select>`;
};
function head(t) { return `<h3>${t}</h3>`; }
function foot() { return `<button class="btn full" onclick="guardar()">Guardar</button><button class="btn sec full" onclick="closeModal()">Cancelar</button>`; }
let cur = null;

function formAporte(r) {
  cur = { type: 'aporte', r };
  modal(head(r ? 'Editar aporte' : 'Nuevo aporte') + `<label>Monto USDT</label><input id="f_usdt" inputmode="decimal" placeholder="500" value="${r ? r.usdt : ''}">` + fNota(r, 'envío inicial, refuerzo…') + fDate(r) + foot());
}
function formCambio(r) {
  if (!monedasActivas().length && !r) return toast('Activa COP o VES en Ajustes');
  cur = { type: 'cambio', r };
  modal(head(r ? 'Editar cambio' : 'Nuevo cambio') + `<label>USDT entregados</label><input id="f_usdt" inputmode="decimal" value="${r ? r.usdt : ''}" oninput="prevTasa()">
    <label>Moneda local</label>${fMon('f_mon', r && r.moneda)}
    <label>Monto local recibido</label><input id="f_local" inputmode="decimal" value="${r ? r.local : ''}" oninput="prevTasa()">
    <label>Comisión en USDT (opcional, se suma al costo)</label><input id="f_com" inputmode="decimal" value="${r && r.com ? r.com : ''}" oninput="prevTasa()">
    <div class="hint" id="f_tasa"></div>` + fNota(r, 'casa de cambio, P2P…') + fDate(r) + foot());
  prevTasa();
}
function prevTasa() {
  const u = num($('#f_usdt').value), l = num($('#f_local').value), k = num($('#f_com').value) || 0;
  $('#f_tasa').textContent = u > 0 && l > 0 ? `Tasa: ${fmtRate(l / (u + k))} por 1 USDT` : '';
}
function formAjuste(r) {
  if (!monedasActivas().length && !r) return toast('Activa COP o VES en Ajustes');
  cur = { type: 'ajuste', r };
  const sale = r ? r.monto < 0 : true, radio = (v, cls, txt, on) => `<label><input type="radio" name="dir" value="${v}" ${on ? 'checked' : ''}><span class="${cls}">${txt}</span></label>`;
  modal(head(r ? 'Editar ajuste' : 'Ajuste de saldo') + `<div class="hint">Mueve el saldo en moneda local sin contar como gasto de nadie. Ej.: abono al hotel (sale) y su devolución (entra).</div>
    <label>Movimiento</label><div class="seg" style="grid-template-columns:1fr 1fr">${radio('out', 's-p2', 'Sale dinero', sale)}${radio('in', 's-n', 'Entra dinero', !sale)}</div>
    <label>Monto</label><div style="display:grid;grid-template-columns:2fr 1fr;gap:8px"><input id="f_monto" inputmode="decimal" value="${r ? Math.abs(r.monto) : ''}">${fMon('f_mon', r && r.moneda)}</div>` + fNota(r, 'abono hotel, devolución hotel…') + fDate(r) + foot());
}
function formGasto(r) {
  cur = { type: 'gasto', r };
  const tp = r ? r.tipo : 'comp', cat = r ? r.cat : 'Comida';
  const radio = (n, v, cls, txt, on) => `<label><input type="radio" name="${n}" value="${v}" ${on ? 'checked' : ''}><span class="${cls}">${txt}</span></label>`;
  modal(head(r ? 'Editar gasto' : 'Nuevo gasto') + `<label>Tipo de gasto</label><div class="seg">
      ${radio('tipo', 'comp', 's-comp', 'Compartido<br>50/50', tp === 'comp')}${radio('tipo', 'p1', 's-p1', 'Personal<br>' + esc(S.settings.p1), tp === 'p1')}${radio('tipo', 'p2', 's-p2', 'Personal<br>' + esc(S.settings.p2), tp === 'p2')}</div>
    <label>Monto</label><div style="display:grid;grid-template-columns:2fr 1fr;gap:8px"><input id="f_monto" inputmode="decimal" value="${r ? r.monto : ''}">${fMon('f_mon', r && r.moneda, true)}</div>
    <label>Categoría</label><div class="seg">${CATS.map(k => radio('cat', k, 's-n', k, k === cat)).join('')}</div>` + fNota(r, 'opcional') + fDate(r) + foot());
}

function guardar() {
  const r = cur.r, ts = $('#f_ts').value ? new Date($('#f_ts').value).toISOString() : new Date().toISOString();
  const nota = $('#f_nota') ? $('#f_nota').value.trim() : '';
  const c = calc(S, r && r.id), rec = { id: r ? r.id : uid(), type: cur.type, ts, nota };
  if (cur.type === 'aporte') {
    rec.usdt = num($('#f_usdt').value);
    if (!(rec.usdt > 0)) return alert('Ingresa un monto USDT mayor que 0.');
  } else if (cur.type === 'cambio') {
    rec.usdt = num($('#f_usdt').value); rec.moneda = $('#f_mon').value; rec.local = num($('#f_local').value); rec.com = num($('#f_com').value) || 0;
    if (!(rec.usdt > 0) || !(rec.local > 0)) return alert('Ingresa USDT entregados y monto local recibido.');
    if (rec.com < 0) return alert('La comisión no puede ser negativa.');
    if (rec.usdt + rec.com > c.restanteSinCambiar - c.gastoUSDT + EPS)
      return alert(`No puedes cambiar más USDT de los disponibles (${fmt(c.restante)} USDT).`);
  } else if (cur.type === 'ajuste') {
    const m = num($('#f_monto').value); rec.moneda = $('#f_mon').value;
    if (!(m > 0)) return alert('Ingresa un monto mayor que 0.');
    rec.monto = document.querySelector('input[name=dir]:checked').value === 'out' ? -m : m;
    const disp = c.mon[rec.moneda].saldo;
    if (rec.monto < 0 && m > disp + EPS && !confirm(`La salida (${fmt(m)} ${rec.moneda}) supera el saldo disponible (${fmt(disp)} ${rec.moneda}). ¿Registrar de todos modos?`)) return;
  } else {
    rec.monto = num($('#f_monto').value); rec.moneda = $('#f_mon').value;
    rec.tipo = document.querySelector('input[name=tipo]:checked').value; rec.cat = document.querySelector('input[name=cat]:checked').value;
    if (!(rec.monto > 0)) return alert('Ingresa un monto mayor que 0.');
    const disp = rec.moneda === 'USDT' ? c.restante : c.mon[rec.moneda].saldo;
    if (rec.monto > disp + EPS && !confirm(`El gasto (${fmt(rec.monto)} ${rec.moneda}) supera el saldo disponible (${fmt(disp)} ${rec.moneda}). ¿Registrar de todos modos?`)) return;
  }
  if (r) S.records[S.records.findIndex(x => x.id === r.id)] = rec; else S.records.push(rec);
  save(); closeModal(); render(); toast('Guardado');
}

/* ---------- cerrar viaje ---------- */
function resumenTexto() {
  const c = calc(), L = [];
  L.push('RESUMEN DEL VIAJE', '');
  L.push(`Total aportado: ${fmt(c.aportado)} USDT`, `Total cambiado: ${fmt(c.cambiado)} USDT`);
  MONEDAS.filter(m => c.mon[m].rec || c.mon[m].gas).forEach(m => L.push(`Tasa prom. ${m}: ${fmtRate(c.mon[m].tasa)} ${m}/USDT (recibido ${fmt(c.mon[m].rec)} ${m})`));
  L.push(`Total gastado: ${fmt(c.total)} USDT equiv.`, '');
  ['p1', 'p2'].forEach(p => { const t = c.p[p].pers + c.p[p].comp; L.push(`${nombre(p)}: ${fmt(t)} USDT (${c.total > 0 ? fmt(t / c.total * 100) : '0,00'}%) — personal ${fmt(c.p[p].pers)} + compartido ${fmt(c.p[p].comp)}`); });
  L.push('', `Sobrante USDT: ${fmt(c.restante)}`);
  MONEDAS.filter(m => c.mon[m].rec || c.mon[m].gas).forEach(m => L.push(`Sobrante ${m}: ${fmt(c.mon[m].saldo)} ${m}`));
  return L.join('\n');
}
function cerrarViaje() {
  const t = resumenTexto();
  modal(head('🏁 Cierre del viaje') + `<pre style="white-space:pre-wrap;font:15px/1.6 inherit;margin:8px 0">${esc(t)}</pre>
    <button class="btn full" onclick="copiar()">Copiar resumen</button><button class="btn sec full" onclick="closeModal()">Cerrar</button>`);
}
function copiar() { try { navigator.clipboard.writeText(resumenTexto()).then(() => toast('Copiado')); } catch (e) { toast('No se pudo copiar'); } }

/* ---------- ajustes / exportar ---------- */
function vAjustes() {
  const s = S.settings;
  return `<div class="card"><h2>Personas</h2>
    <label>Persona 1 (administra el fondo)</label><input id="s_p1" value="${esc(s.p1)}">
    <label>Persona 2</label><input id="s_p2" value="${esc(s.p2)}"></div>
    <div class="card"><h2>Monedas locales</h2>
    <div class="sw"><span>Pesos colombianos (COP)</span><input type="checkbox" id="s_COP" ${s.COP ? 'checked' : ''}></div>
    <div class="sw"><span>Bolívares (VES)</span><input type="checkbox" id="s_VES" ${s.VES ? 'checked' : ''}></div>
    <label>Alerta de saldo bajo (USDT)</label><input id="s_umbral" inputmode="decimal" value="${s.umbral}"></div>
    <div class="card"><h2>Datos</h2>
    <button class="btn sec full" onclick="exportCSV()">Exportar CSV (Excel)</button>
    <button class="btn sec full" onclick="exportJSON()">Exportar respaldo JSON</button>
    <button class="btn sec full" onclick="$('#imp').click()">Importar respaldo JSON</button>
    <input type="file" id="imp" accept=".json,application/json" hidden>
    <button class="btn red full" onclick="borrarTodo()">Borrar todos los datos</button></div>
    <div class="hint" style="text-align:center">Todo se guarda solo en este dispositivo.</div>`;
}
function bindAjustes() {
  const upd = () => {
    S.settings.p1 = $('#s_p1').value.trim() || 'Persona 1'; S.settings.p2 = $('#s_p2').value.trim() || 'Persona 2';
    S.settings.COP = $('#s_COP').checked; S.settings.VES = $('#s_VES').checked;
    const u = num($('#s_umbral').value); S.settings.umbral = isNaN(u) ? 0 : u; save();
  };
  ['#s_p1', '#s_p2', '#s_COP', '#s_VES', '#s_umbral'].forEach(id => $(id).addEventListener('input', upd));
  $('#imp').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const j = JSON.parse(rd.result); if (!j || !Array.isArray(j.records)) throw 0;
        if (!confirm('Esto reemplazará todos los datos actuales. ¿Continuar?')) return;
        S = Object.assign(defaults(), j); S.settings = Object.assign(defaults().settings, j.settings); save(); render(); toast('Respaldo importado');
      } catch (x) { alert('Archivo de respaldo no válido.'); }
    };
    rd.readAsText(f);
  };
}
function borrarTodo() { if (confirm('¿Borrar TODOS los datos? No se puede deshacer.') && confirm('Segunda confirmación: ¿seguro?')) { S = defaults(); save(); render(); toast('Datos borrados'); } }
function download(name, text, mime) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: mime })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function exportJSON() { download(`viaticos-respaldo-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(S, null, 1), 'application/json'); }
function csvRows() {
  const c = calc(), n = v => (v === '' || v == null) ? '' : String(round(v, 4)).replace('.', ',');
  const q = s => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
  const rows = [['Fecha', 'Registro', 'USDT', 'Comisión USDT', 'Moneda', 'Monto', 'Tasa', 'Categoría', 'Tipo de gasto', 'Consumo ' + S.settings.p1 + ' (USDT)', 'Consumo ' + S.settings.p2 + ' (USDT)', 'Nota'].map(q)];
  S.records.slice().sort((a, b) => a.ts.localeCompare(b.ts)).forEach(r => {
    const f = new Date(r.ts); f.setMinutes(f.getMinutes() - f.getTimezoneOffset()); const fecha = f.toISOString().slice(0, 16).replace('T', ' ');
    if (r.type === 'aporte') rows.push([fecha, 'Aporte', n(r.usdt), '', 'USDT', n(r.usdt), '', '', '', '', '', q(r.nota)]);
    else if (r.type === 'ajuste') rows.push([fecha, 'Ajuste de saldo', '', '', r.moneda, n(r.monto), '', '', '', '', '', q(r.nota)]);
    else if (r.type === 'cambio') rows.push([fecha, 'Cambio', n(r.usdt), n(r.com || 0), r.moneda, n(r.local), n(r.local / (r.usdt + (r.com || 0))), '', '', '', '', q(r.nota)]);
    else {
      const e = c.eq[r.id] || 0, a = r.tipo === 'comp' ? e / 2 : r.tipo === 'p1' ? e : 0, b = r.tipo === 'comp' ? e / 2 : r.tipo === 'p2' ? e : 0;
      rows.push([fecha, 'Gasto', n(e), '', r.moneda, n(r.monto), '', r.cat, q(nombre(r.tipo)), n(a), n(b), q(r.nota)]);
    }
  });
  return rows.map(r => r.join(';')).join('\r\n');
}
function exportCSV() { download(`viaticos-${new Date().toISOString().slice(0, 10)}.csv`, '﻿' + csvRows(), 'text/csv;charset=utf-8'); }

render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
